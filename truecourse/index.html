<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrueCourse — terms and policies</title><style>:root{--bg:#f7f6f2;--fg:#1b1d21;--muted:#55595f;--rule:#d9d6cc;--accent:#9a5b00;--warn-bg:#fff4dd;--warn:#7a4a00}
@media (prefers-color-scheme: dark){:root{--bg:#0e0f11;--fg:#e9e7e1;--muted:#a3a6ab;--rule:#2a2c30;--accent:#f0a830;--warn-bg:#2a2110;--warn:#f0c070}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:44rem;margin:0 auto;padding:1.5rem 1rem 4rem}a{color:var(--accent)}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;background:var(--bg);padding:.5rem}
nav ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.5rem 1rem;border-bottom:1px solid var(--rule);padding-bottom:.75rem}
nav a[aria-current]{font-weight:700;color:var(--fg)}
h1{font-size:1.8rem;line-height:1.2}h2{font-size:1.2rem;margin-top:2rem;border-top:1px solid var(--rule);padding-top:1rem}
.draft{background:var(--warn-bg);color:var(--warn);padding:.75rem 1rem;border-radius:6px}
footer{color:var(--muted);font-size:.9rem;margin-top:3rem}
.part{font-size:1.5rem;margin-top:3rem}figure{margin:1rem 0}figure img{max-width:100%;height:auto;border-radius:12px}</style></head>
